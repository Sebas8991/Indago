<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />

  <!-- Vercel Speed Insights -->
  <script type="module">
    import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@2.0.0/dist/index.mjs';
    injectSpeedInsights();
  </script>
</head>
<body style="margin:0;padding:0;background:#ffffff;">

<table cellpadding="0" cellspacing="0" border="0" style="font-family:'DM Sans',Arial,sans-serif;font-weight:300;color:#1a1a18;max-width:480px;">
  <tr>
    <td style="padding:0 0 16px 0;">

      <!-- línea superior teal -->
      <div style="width:40px;height:1px;background:#6b9b99;margin-bottom:18px;"></div>

      <!-- nombre -->
      <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:400;letter-spacing:0.04em;color:#1a1a18;margin-bottom:4px;">
        Sebastián Bustos Riveros
      </div>

      <!-- título -->
      <div style="font-family:'DM Sans',Arial,sans-serif;font-size:11px;font-weight:300;letter-spacing:0.14em;text-transform:uppercase;color:#6b9b99;margin-bottom:16px;">
        Mtro. y Especialista &middot; Psicólogo Clínico
      </div>

      <!-- separador -->
      <div style="width:100%;height:1px;background:#e8e4de;margin-bottom:14px;"></div>

      <!-- email -->
      <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom:8px;">
        <tr>
          <td style="padding-right:10px;vertical-align:middle;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b9b99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="3"/>
              <polyline points="2,4 12,13 22,4"/>
            </svg>
          </td>
          <td style="font-family:'DM Sans',Arial,sans-serif;font-size:12px;font-weight:300;color:#3a3a36;">
            sebas.bustos@icloud.com
          </td>
        </tr>
      </table>

      <!-- teléfono -->
      <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom:8px;">
        <tr>
          <td style="padding-right:10px;vertical-align:middle;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b9b99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.8a16 16 0 0 0 6.29 6.29l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7a2 2 0 0 1 1.72 2.04z"/>
            </svg>
          </td>
          <td style="font-family:'DM Sans',Arial,sans-serif;font-size:12px;font-weight:300;color:#3a3a36;">
            +52 (55) 8614 7498
          </td>
        </tr>
      </table>

      <!-- web -->
      <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom:0;">
        <tr>
          <td style="padding-right:10px;vertical-align:middle;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b9b99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/>
            </svg>
          </td>
          <td style="font-family:'DM Sans',Arial,sans-serif;font-size:12px;font-weight:300;">
            <a href="https://indago.life" style="color:#6b9b99;text-decoration:none;">indago.life</a>
          </td>
        </tr>
      </table>

      <!-- separador -->
      <div style="width:100%;height:1px;background:#e8e4de;margin:14px 0;"></div>

      <!-- logo indago + frase -->
      <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:15px;font-weight:400;letter-spacing:0.1em;color:#1a1a18;margin-bottom:4px;">
        indago
      </div>
      <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:12px;font-style:italic;font-weight:300;color:#7a7a74;line-height:1.6;">
        Un espacio para pensar lo que aún no encuentra palabras.
      </div>

    </td>
  </tr>
</table>

</body>
</html>
