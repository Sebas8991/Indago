<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Sebastián Bustos · Indago</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --cream:#f7f4ef;--warm-white:#faf9f7;--ink:#1a1a18;--ink-soft:#3a3a36;
      --ink-muted:#7a7a74;--teal:#6b9b99;--teal-light:#9bbebb;--teal-pale:#ddeae9;
      --sand:#c9bfab;--fog:#e8e4de;
      --serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',sans-serif;
    }
    html,body{height:100%;font-family:var(--sans);font-weight:300;background:var(--cream);color:var(--ink);overflow-x:hidden}
    body{display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:0 0 4rem}
    .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .bg-blob{position:absolute;border-radius:50%;opacity:0;animation:blobIn 1.8s ease forwards}
    .bg-blob:nth-child(1){width:420px;height:420px;top:-120px;right:-80px;background:var(--teal-pale);animation-delay:.1s}
    .bg-blob:nth-child(2){width:280px;height:280px;bottom:-60px;left:-60px;background:var(--fog);animation-delay:.3s}
    .bg-blob:nth-child(3){width:180px;height:180px;top:55%;right:-40px;background:var(--sand);animation-delay:.5s}
    @keyframes blobIn{to{opacity:.5}}
    .card{position:relative;z-index:1;width:100%;max-width:420px;padding:0 1.5rem;display:flex;flex-direction:column;align-items:center}
    .header{width:100%;display:flex;flex-direction:column;align-items:center;padding-top:3.5rem;padding-bottom:2rem;opacity:0;transform:translateY(24px);animation:fadeUp .9s ease .2s forwards}
    .avatar-wrap{position:relative;width:160px;height:160px;margin-bottom:1.4rem}
    .avatar{width:160px;height:160px;border-radius:50%;object-fit:cover;object-position:center top;border:4px solid var(--warm-white);box-shadow:0 6px 28px rgba(26,26,24,.12)}
    .logo-badge{position:absolute;bottom:-2px;right:-2px;width:44px;height:44px;background:var(--warm-white);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(26,26,24,.14);padding:6px}
    .logo-badge img{width:100%;height:100%;object-fit:contain}
    .name{font-family:var(--serif);font-size:1.9rem;font-weight:400;letter-spacing:.01em;color:var(--ink);text-align:center;line-height:1.2;margin-bottom:.3rem}
    .role{font-size:.78rem;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);text-align:center;margin-bottom:1rem}
    .divider{width:32px;height:1px;background:var(--teal);opacity:.5;margin-bottom:.9rem}
    .tagline{font-family:var(--serif);font-size:1.05rem;font-style:italic;color:var(--ink-muted);text-align:center;line-height:1.6}
    .links{width:100%;display:flex;flex-direction:column;gap:.85rem;margin-top:.5rem}
    .link-item{display:flex;align-items:center;gap:1rem;background:var(--warm-white);border-radius:14px;padding:1rem 1.2rem;text-decoration:none;color:var(--ink);box-shadow:0 1px 4px rgba(26,26,24,.06);border:1px solid rgba(232,228,222,.8);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;opacity:0;transform:translateY(16px)}
    .link-item:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,26,24,.10);border-color:var(--teal-pale)}
    .link-item:active{transform:scale(.98)}
    .link-item:nth-child(1){animation:fadeUp .7s ease .5s forwards}
    .link-item:nth-child(2){animation:fadeUp .7s ease .65s forwards}
    .link-item:nth-child(3){animation:fadeUp .7s ease .8s forwards}
    .link-item:nth-child(4){animation:fadeUp .7s ease .95s forwards}
    .link-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .link-icon svg{width:22px;height:22px}
    .icon-wa{background:#e8f5f5}.icon-web{background:var(--teal-pale)}.icon-mp{background:#eef2ef}.icon-mail{background:var(--fog)}
    .link-text{display:flex;flex-direction:column;gap:.1rem;flex:1}
    .link-label{font-size:.92rem;font-weight:400;color:var(--ink);letter-spacing:.01em}
    .link-sub{font-size:.72rem;color:var(--ink-muted);letter-spacing:.02em}
    .link-arrow{color:var(--sand);flex-shrink:0}
    .footer{margin-top:2.5rem;text-align:center;opacity:0;animation:fadeUp .7s ease 1.2s forwards}
    .footer-logo{font-family:var(--serif);font-size:1.1rem;font-weight:400;letter-spacing:.14em;color:var(--ink-muted);opacity:.5}
    @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
  </style>

  <!-- Vercel Speed Insights -->
  <script type="module">
    import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@2.0.0/dist/index.mjs';
    injectSpeedInsights();
  </script>
